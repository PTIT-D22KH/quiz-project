<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-KK94CHFLLe+nY2dmCWGMq91rCGa5gtU4mk92HdvYe+M/SXH301p5ILy+dN9+nJOZ" crossorigin="anonymous">
    <link rel="stylesheet" href="/static/css/style.css">
  </head>

<body>
  
  <!-- START NAV -->
  <nav class="navbar navbar-expand-lg bg-body-tertiary d-none d-lg-block">
    <div class="container">
        <a class="navbar-brand" href="">
            <img src="/static/images/logo_ptit.png" alt="" style="width: 30px;">
            </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
            data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false"
            aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarSupportedContent">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                <li class="nav-item">
                    <a class="nav-link active" aria-current="page" href="{% url 'home'%}">Home</a>
                </li>
            </ul>
        </div>
    </div>
</nav>
<!-- END NAV -->
<h1 class="display-4 text-center my-5">Register</h1>

<div class="container">
  <div class="row row-cols-sm-1 row-cols-lg-3 container">
    <div class="col-12">
    </div>
    <div class="col-12">
      <div>
        {% for message in messages %}
        <h5 class="text-danger">{{message}}</h5>
        {% endfor %}
      </div>

      <form method="POST" action="">
        {% csrf_token %}
        <div class="mb-3">
          <label for="exampleInputEmail2" class="form-label visually-hidden">Email</label>
          <input type="email" name="email" class="form-control" id="exampleInputEmail2" aria-describedby="emailHelp"
            placeholder="Email" required>
        </div>
        <div class="mb-3">
          <label for="exampleInputUsername1" class="form-label visually-hidden">Username</label>
          <input type="text" name="username" class="form-control" id="exampleInputUsername1" aria-describedby="emailHelp"
            placeholder="Username" required>
        </div>
        <div class="mb-3">
          <label for="exampleInputPassword1" class="form-label visually-hidden">Password</label>
          <input type="password" name="password" class="form-control" id="exampleInputPassword1" placeholder="Password" required>
        </div>
        <div class="mb-3">
          <label for="exampleInputPassword2" class="form-label visually-hidden">Repeat Password</label>
          <input type="password" name="password2" class="form-control" id="exampleInputPassword2" placeholder="Repeat Password" required>
        </div>
        <div class="mb-3 form-check">
          <input type="checkbox" class="form-check-input" id="exampleCheck1" required>
          <label class="form-check-label" for="exampleCheck1">Terms and Conditions</a></label>
        </div>
        <button type="submit" class="btn btn-primary">Register</button>
        <p class="my-4">Already a member? <b><a href="{% url 'login' %}">Login</a></b></p>
      </form>
    </div>
    <div class="col-12">
    </div>
  </div>
</div>
<footer class="py-3 my-4">
  <p class="text-center text-body-secondary">© 2024, D22-DSP Lab PTIT</p>
</footer>
